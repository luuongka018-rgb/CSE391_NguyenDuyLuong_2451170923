<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>products</title>

    <link rel="stylesheet" href="css/positioning.css">
</head>
<body>

    <header class="header">
        <div class="logo">ShopTLU</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <div class="container">

        <aside class="sidebar">
            <h2>Danh mục</h2>

            <ul>
                <li>Điện thoại</li>
                <li>Laptop</li>
                <li>Tai nghe</li>
                <li>Phụ kiện</li>
            </ul>
        </aside>

        <main class="content">

            <div class="product-card">
                <div class="badge">HOT</div>

                <img src="https://apple.ngocnguyen.vn/cdn/images/202510/goods_img/iphone-16-pro-chinh-hang--like-new-99-G15738-1759568031635.png"
                     alt="product">

                <h3>iPhone 16 Pro</h3>

                <p>
                    Điện thoại cao cấp mới nhất.
                </p>
            </div>

            <div class="product-card">
                <div class="badge">HOT</div>

                <img src="https://uscom.com.vn/wp-content/uploads/2024/10/Macbook-Pro-M4-2024-Silver.webp"
                     alt="product">

                <h3>MacBook Pro</h3>

                <p>
                    Laptop mạnh mẽ cho lập trình.
                </p>
            </div>

            <div class="product-card">
                <div class="badge">HOT</div>

                <img src="https://cdn2.cellphones.com.vn/insecure/rs:fill:358:358/q:90/plain/https://cellphones.com.vn/media/catalog/product/g/r/group_111_1_1.png"
                     alt="product">

                <h3>AirPods Pro</h3>

                <p>
                    Tai nghe chống ồn chất lượng cao.
                </p>
            </div>

        </main>
    </div>

    <a href="#" class="scroll-top">↑</a>
<!-- abc/ -->
</body>
</html>
