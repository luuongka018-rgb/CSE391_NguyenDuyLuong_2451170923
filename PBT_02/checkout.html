<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Form</title>
</head>
<body>
    <h1>Checkout</h1>
    <form action="#" method="POST">
        <!-- Phần 1 -->
        <h2>Giỏ hàng</h2>
        <table border="1" cellpadding="10">
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Sản phẩm</th>
                    <th>Đơn giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>1</td>
                    <td>iPhone 16</td>
                    <td>20.000.000đ</td>
                    <td>1</td>
                    <td>20.000.000đ</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>AirPods Pro</td>
                    <td>5.000.000đ</td>
                    <td>2</td>
                    <td>10.000.000đ</td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>Apple Watch</td>
                    <td>8.000.000đ</td>
                    <td>1</td>
                    <td>8.000.000đ</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="4">
                        <strong>Tổng cộng</strong>
                    </td>
                    <td>
                        <strong>38.000.000đ</strong>
                    </td>
                </tr>
            </tfoot>
        </table>
        <br>

        <!-- Phần 2 -->
        <fieldset>
            <legend>Thanh toán</legend>
            <p>Phương thức thanh toán</p>

            <input type="radio" id="cod" name="payment">
            <label for="cod">COD</label>

            <input type="radio" id="bank" name="payment">
            <label for="bank">Chuyển khoản</label>

            <input type="radio" id="wallet" name="payment">
            <label for="wallet">Ví điện tử</label>

            <br><br>
            <label for="coupon">Mã giảm giá</label>
            <input
                type="text"
                id="coupon"
                name="coupon"
                pattern="SALE[0-9]{4}"
                placeholder="SALE2026">

            <br><br>
            <label for="note">Ghi chú</label>
            <textarea
                id="note"
                name="note"
                rows="3"
                placeholder="Nhập ghi chú">
            </textarea>
        </fieldset>

        <br>

        <!-- Phần 3 -->
        <fieldset>
            <legend>Thông tin giao hàng</legend>

            <label for="delivery-date">
                Ngày giao hàng mong muốn
            </label>

            <input
                type="date"
                id="delivery-date"
                name="delivery-date"
                min="2026-05-21">

            <br><br>

            <label for="time-slot">Khung giờ</label>

            <select id="time-slot" name="time-slot">
                <option value="">-- Chọn khung giờ --</option>
                <option>Sáng 8-12h</option>
                <option>Chiều 14-18h</option>
                <option>Tối 18-21h</option>
            </select>

            <br><br>

            <label for="time">
                Thời gian giao hàng (1-7 ngày)
            </label>

            <input
                type="range"
                id="time"
                name="time"
                min="1"
                max="7"
                step="1">

        </fieldset>

        <br>

        <button 
            type="submit"
            aria-label="Xác nhận đặt hàng">
            Đặt hàng
        </button>

        <button type="reset">
            Reset
        </button>
    </form>
</body>
</html>
