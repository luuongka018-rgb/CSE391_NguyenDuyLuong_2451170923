<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form đăng ký</title>
</head>
<body>
    <h1>Đăng ký tài khoản</h1>
    <form action="#" method="POST">

        <fieldset>
            <legend>Thông tin cá nhân</legend>

            <label for="fullname">Họ tên</label>
            <input 
                type="text"
                id="fullname"
                name="fullname"
                required
                minlength="2"
                maxlength="50"
                placeholder="Nhập họ tên">
            <br><br>

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                placeholder="vd@gmail.com">

            <br><br>

            <label for="phone">Số điện thoại</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                pattern="[0-9]{10}"
                title="Nhập đúng 10 chữ số"
                placeholder="0912345678">

            <br><br>

            <label for="birthday">Ngày sinh</label>
            <input
                type="date"
                id="birthday"
                name="birthday"
                max="2026-05-20"
                placeholder="Chọn ngày sinh">
        </fieldset>
        <br>
        <fieldset>
            <legend>Tài khoản</legend>
            <label for="username">Tên đăng nhập</label>
            <input
                type="text"
                id="username"
                name="username"
                pattern="[A-Za-z0-9_]{3,20}"
                title="3-20 ký tự, chỉ gồm chữ, số và dấu gạch dưới"
                placeholder="ten_dang_nhap_123">
            <br><br>
            <label for="password">Mật khẩu</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}"
                title="Ít nhất 8 ký tự, gồm 1 chữ hoa và 1 số"
                placeholder="Nhập mật khẩu">
            <p>
                Mật khẩu phải có ít nhất 8 ký tự,
                gồm 1 chữ hoa và 1 số.
            </p>
            <label for="confirm-password">Xác nhận mật khẩu</label>
            <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                minlength="8"
                pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}"
                title="Ít nhất 8 ký tự, gồm 1 chữ hoa và 1 số"
                placeholder="Nhập lại mật khẩu">
            <p>
                HTML không thể kiểm tra 2 mật khẩu có giống nhau hay không.
                Việc này cần JavaScript hoặc server-side validation.
            </p>
        </fieldset>
        <br>
        <fieldset>
            <legend>Thông tin giao hàng</legend>
            <label for="city">Thành phố</label>
            <select id="city" name="city">
                <option value="">-- Chọn thành phố --</option>
                <option>Hà Nội</option>
                <option>Hồ Chí Minh</option>
                <option>Đà Nẵng</option>
                <option>Hải Phòng</option>
                <option>Cần Thơ</option>
            </select>
            <br><br>
            <label for="district">Quận/Huyện</label>
            <select id="district" name="district">
                <option value="">-- Chọn quận/huyện --</option>
                <option>Ba Đình</option>
                <option>Cầu Giấy</option>
                <option>Đống Đa</option>
                <option>Thanh Xuân</option>
            </select>
            <br><br>
            <label for="address">Địa chỉ chi tiết</label>
            <textarea
                id="address"
                name="address"
                rows="3"
                placeholder="Nhập địa chỉ chi tiết"></textarea>
            <br><br>
            <fieldset>
                <legend>Giới tính</legend>
                <input type="radio" id="male" name="gender">
                <label for="male">Nam</label>

                <input type="radio" id="female" name="gender">
                <label for="female">Nữ</label>

                <input type="radio" id="other" name="gender">
                <label for="other">Khác</label>
            </fieldset>
            <br>
            <input type="checkbox" id="agree" required>
            <label for="agree">Tôi đồng ý đièu khoản</label>
        </fieldset>
        <br>
        <!-- abc -->
        <button type="submit">Gửi</button>
        <button type="reset">Đặt lại</button>
    </form>
</body>
</html>
