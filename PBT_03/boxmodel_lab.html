<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Lab</title>

    <link rel="stylesheet" href="css/boxmodel.css">
</head>
<body>

    <h1>Phần 1 — Content-box vs Border-box</h1>

    <div class="wrapper">
        <div class="box content-box">
            <h2>Content-box</h2>
            <p>width: 300px</p>
            <p>padding: 20px</p>
            <p>border: 5px</p>
        </div>

        <div class="box border-box">
            <h2>Border-box</h2>
            <p>width: 300px</p>
            <p>padding: 20px</p>
            <p>border: 5px</p>
        </div>
    </div>

    <hr>

    <h1>Phần 2 — Layout 3 cột</h1>

    <div class="layout normal-layout">
        <aside class="sidebar">
            Sidebar
        </aside>

        <main class="content">
            Main Content
        </main>

        <aside class="ads">
            Ads
        </aside>
    </div>

    <h2>Dùng border-box</h2>

    <div class="layout fixed-layout">
        <aside class="sidebar">
            Sidebar
        </aside>

        <main class="content">
            Main Content
        </main>

        <aside class="ads">
            Ads
        </aside>
    </div>
</body>
</html>
